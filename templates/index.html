<!doctype html> <!-- tell browser to use html -->
<html> <!-- root element, language may be added  -->
<head> <!-- head contains metadata -->
    <meta charset="utf-8">
    <!-- viewport: ensures responsivity for mobile dev. -->
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <!-- pulls bootstrap CSS - so we don't need to write our own -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- shows browser tab Title -->
    <title>Brewsheet Converter</title>
</head>
<body class="bg-light"> <!-- light background-->
    <div class="container py-5"> <!-- centers content, limits page width --- py-5 is vertical padding -->
        <h1 class="mb-4">Another Brewing Co. Brewsheet Converter</h1> <!-- h1 = main page heading --- mb-4 is margin-->



        <!-- 
        form element is connection to flask app 
        method="post"                   send form data in request body to the backend
        action="/convert"               URL or Flask route that receives the form (@app.route and methods must match)
        enctype="multipart/form-data"   requirement for file uploads: browser pacsk file bytes correctly to request
        class="card p-4"                Bootstrap visual wrapper (card look + padding)
        
        User presses submit = send HTTP Post to /convert 
        -->
        <form method="post" action="/convert" enctype="multipart/form-data" class="card p-4">
            <!-- FILE UPLOAD
            type="file"                 produces file chooser to pick from PC
            id="file"                   used by <label for="file"> so that clicking opens file dialog
            name="file"                 the key flask uses to find the uploaded file later
            accept=".json"              filter set to accept only .json filetypes
            required                    field is required to submit
            -->
            <div class="mb-3">
                <label for="file" class="form-label">JSON file</label>
                <input class="form-control" type="file" id="file" name="file" accept=".json" required>
            </div>
            <!-- SIMPLE FIELDS
            simple form fields (next two)
            type="text"                 free text field with placeholder text
            type="date"                 shows a date-picker in browser / returns YYYY-MM-DD value
            name="..."                  the key flask uses for these values
            -->
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input class="form-control" type="text" id="name" name="name" placeholder="Your name">
            </div>

            <div class="mb-3">
                <label for="date" class="form-label">Date</label>
                <input class="form-control" type="date" id="date" name="date">
            </div>
            <!-- SUBMIT BUTTON
            type="submit"               triggers to gather all fields and post on the URL given in action
            btn btn-primary             bootstrap styling classes
            -->
            <button class="btn btn-primary" type="submit">Run</button>
        </form>

        <p class="text-muted mt-3">Tip: you can also use `curl` to POST a file (see README)</p>
    </div>
</body>
</html>
